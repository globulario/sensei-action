name: Bootstrap live smoke

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "examples/sensei-bootstrap.yml"
      - ".github/workflows/bootstrap-smoke.yml"
  workflow_dispatch:
    inputs:
      model:
        description: GitHub Models model used for the live proof
        required: false
        default: openai/gpt-4.1
        type: string

permissions:
  contents: read
  issues: write
  models: read

jobs:
  bootstrap-dry-run:
    runs-on: ubuntu-latest
    env:
      SENSEI_MODEL: ${{ inputs.model || 'openai/gpt-4.1' }}
      PROOF_ARTIFACT: sensei-bootstrap-live-proof-${{ github.run_id }}
      PROOF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v4

      - name: Require the personal Models token
        shell: bash
        env:
          MODELS_TOKEN: ${{ secrets.SENSEI_MODELS_TOKEN }}
        run: |
          if [ -z "$MODELS_TOKEN" ]; then
            echo "::error::SENSEI_MODELS_TOKEN is not configured."
            exit 1
          fi

      - name: Verify GitHub Models access
        uses: actions/ai-inference@v1
        with:
          prompt: 'Return exactly: {"ok":true}'
          model: ${{ env.SENSEI_MODEL }}
          max-tokens: '20'
          token: ${{ secrets.SENSEI_MODELS_TOKEN }}

      - name: Create a trusted fixture repository
        shell: bash
        run: |
          set -euo pipefail
          git init -b main fixture >/dev/null
          git -C fixture config user.name "Sensei Smoke"
          git -C fixture config user.email "sensei-smoke@users.noreply.github.com"
          mkdir -p fixture/cmd/orders fixture/internal/repository
          printf '%s\n' '# Orders service' '' 'The HTTP API accepts orders and persists them through the repository package.' 'Business handlers must not write directly to the database adapter.' > fixture/README.md
          printf '%s\n' 'module example.com/orders' '' 'go 1.25' > fixture/go.mod
          printf '%s\n' 'package main' '' 'func main() {}' > fixture/cmd/orders/main.go
          printf '%s\n' 'package repository' '' 'type Order struct { ID string }' > fixture/internal/repository/orders.go
          git -C fixture add -A
          git -C fixture commit -m "initial fixture" >/dev/null

      - name: Run the Action-first bootstrap
        uses: ./bootstrap
        with:
          repository-root: fixture
          base-branch: main
          dry-run: 'true'
          model: ${{ env.SENSEI_MODEL }}
          models-token: ${{ secrets.SENSEI_MODELS_TOKEN }}
          sensei-ref: v1.1.0

      - name: Verify the bootstrap receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="fixture/.sensei/ai-bootstrap-receipt.json"
          test -s "$receipt"
          jq -e \
            --arg model "$SENSEI_MODEL" \
            '.schema == "sensei.ai_bootstrap.receipt.v1" and
             .model == $model and
             (.accepted_attempt == 1 or .accepted_attempt == 2) and
             (.context_sha256 | length == 64) and
             (.proposal_response_sha256 | length == 64) and
             (.files | length > 0)' \
            "$receipt"

      - name: Preserve live-proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROOF_ARTIFACT }}
          if-no-files-found: warn
          path: |
            fixture/.sensei/ai-bootstrap-receipt.json
            fixture/.sensei/ai-bootstrap-proposal.json
            fixture/docs/awareness/BOOTSTRAP_QUESTIONS.md
            fixture/docs/awareness/invariants.yaml
            fixture/docs/awareness/failure_modes.yaml
            ${{ runner.temp }}/sensei-bootstrap-deterministic.txt
            ${{ runner.temp }}/sensei-ai-bootstrap/**

      - name: Publish successful live proof
        uses: actions/github-script@v7
        env:
          RECEIPT_PATH: fixture/.sensei/ai-bootstrap-receipt.json
        with:
          script: |
            const fs = require('fs');
            const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8'));
            const successMarker = '<!-- sensei-bootstrap-live-proof -->';
            const failureMarker = '<!-- sensei-bootstrap-live-proof-failure -->';
            const runUrl = process.env.PROOF_RUN_URL;
            const artifact = process.env.PROOF_ARTIFACT;
            const body = `${successMarker}
            ## ✅ Action-first bootstrap live proof

            The trusted GitHub-hosted runner completed the full bootstrap path.

            - **source SHA:** \`${context.sha}\`
            - **model:** \`${receipt.model}\`
            - **accepted attempt:** \`${receipt.accepted_attempt}\`
            - **context digest:** \`${receipt.context_sha256}\`
            - **model response digest:** \`${receipt.proposal_response_sha256}\`
            - **written evidence files:** \`${receipt.files.length}\`
            - **artifact:** \`${artifact}\`
            - **workflow run:** ${runUrl}

            Model-authored claims remain \`review_only\`; this proof does not promote them to architectural authority.`;
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: 2 };
            const { data: comments } = await github.rest.issues.listComments({ ...params, per_page: 100 });
            const previous = comments.find(comment => comment.body && comment.body.includes(successMarker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }
            for (const stale of comments.filter(comment => comment.body && comment.body.includes(failureMarker))) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id
              });
            }

      - name: Publish failed live-proof boundary
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const successMarker = '<!-- sensei-bootstrap-live-proof -->';
            const failureMarker = '<!-- sensei-bootstrap-live-proof-failure -->';
            const stateDir = path.join(process.env.RUNNER_TEMP, 'sensei-ai-bootstrap');
            let result = null;
            for (const name of ['attempt-2.result.json', 'attempt-1.result.json']) {
              const candidate = path.join(stateDir, name);
              if (fs.existsSync(candidate)) {
                result = JSON.parse(fs.readFileSync(candidate, 'utf8'));
                break;
              }
            }
            const validation = result && result.validation_output
              ? String(result.validation_output).slice(-3500).replaceAll('```', '` ` `')
              : 'No bounded attempt result was produced; the run stopped before proposal validation.';
            const attempt = result ? result.attempt : 'none';
            const changed = result && Array.isArray(result.changed_files) && result.changed_files.length
              ? result.changed_files.join(', ')
              : 'none';
            const body = `${failureMarker}
            ## ❌ Action-first bootstrap live proof stopped

            The personal Models token and tiny GPT-4.1 preflight succeeded, but the full bootstrap did not reach a valid governed receipt.

            - **source SHA:** \`${context.sha}\`
            - **model:** \`${process.env.SENSEI_MODEL}\`
            - **latest bounded attempt:** \`${attempt}\`
            - **candidate files written before rejection:** \`${changed}\`
            - **artifact:** \`${process.env.PROOF_ARTIFACT}\`
            - **workflow run:** ${process.env.PROOF_RUN_URL}

            **Sensei validation boundary**

            \`\`\`text
            ${validation}
            \`\`\`

            No result should be treated as certified until the success receipt replaces this notice.`;
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: 2 };
            const { data: comments } = await github.rest.issues.listComments({ ...params, per_page: 100 });
            const previous = comments.find(comment => comment.body && comment.body.includes(failureMarker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }
            for (const stale of comments.filter(comment => comment.body && comment.body.includes(successMarker))) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id
              });
            }
