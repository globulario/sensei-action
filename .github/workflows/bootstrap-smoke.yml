name: Bootstrap live smoke

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "examples/sensei-bootstrap.yml"
      - ".github/workflows/bootstrap-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  bootstrap-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Create a trusted fixture repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir fixture
          cd fixture
          git init -b main
          git config user.name "Sensei Smoke"
          git config user.email "sensei-smoke@users.noreply.github.com"
          cat > README.md <<'EOF'
          # Orders service

          The HTTP API accepts orders and persists them through the repository package.
          Business handlers must not write directly to the database adapter.
          EOF
          cat > go.mod <<'EOF'
          module example.com/orders

          go 1.25
          EOF
          mkdir -p cmd/orders internal/repository
          cat > cmd/orders/main.go <<'EOF'
          package main

          func main() {}
          EOF
          cat > internal/repository/orders.go <<'EOF'
          package repository

          type Order struct { ID string }
          EOF
          git add -A
          git commit -m "initial fixture"

      - name: Run the Action-first bootstrap
        uses: globulario/sensei-action/bootstrap@agent/action-first-bootstrap
        with:
          repository-root: fixture
          base-branch: main
          dry-run: 'true'
          model: openai/gpt-4o
          sensei-ref: v1.1.0
