name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -m unittest discover -s bootstrap/tests -v
      - name: Shell syntax
        run: bash -n bootstrap/scripts/install-sensei.sh
      - name: Parse action YAML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('action.yml'); YAML.load_file('bootstrap/action.yml'); YAML.load_file('examples/sensei-bootstrap.yml'); YAML.load_file('.github/workflows/bootstrap-smoke.yml')"
      - name: Verify Models token boundary
        run: |
          grep -Fq 'default: openai/gpt-4.1' bootstrap/action.yml
          grep -Fq 'token: ${{ inputs.models-token || github.token }}' bootstrap/action.yml
          grep -Fq 'models-token: ${{ secrets.SENSEI_MODELS_TOKEN }}' examples/sensei-bootstrap.yml
          grep -Fq 'token: ${{ secrets.SENSEI_MODELS_TOKEN }}' .github/workflows/bootstrap-smoke.yml
          if grep -Fq 'pull_request:' .github/workflows/bootstrap-smoke.yml; then
            echo 'The secret-bearing live smoke must not run on pull requests.' >&2
            exit 1
          fi
