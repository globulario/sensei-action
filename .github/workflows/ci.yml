name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -m unittest discover -s bootstrap/tests -v
      - name: Shell syntax
        run: bash -n bootstrap/scripts/install-sensei.sh
      - name: Parse action YAML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('action.yml'); YAML.load_file('bootstrap/action.yml'); YAML.load_file('examples/sensei-bootstrap.yml')"
