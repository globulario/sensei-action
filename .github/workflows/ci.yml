name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -m unittest discover -s bootstrap/tests -v
      - name: Shell syntax
        run: bash -n bootstrap/scripts/install-sensei.sh
      - name: Parse action YAML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('action.yml'); YAML.load_file('bootstrap/action.yml'); YAML.load_file('examples/sensei-bootstrap.yml'); YAML.load_file('.github/workflows/bootstrap-smoke.yml')"
      - name: Verify Models token boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          action = Path('bootstrap/action.yml').read_text()
          example = Path('examples/sensei-bootstrap.yml').read_text()
          smoke = Path('.github/workflows/bootstrap-smoke.yml').read_text()
          expression_open = '$' + '{{'

          assert 'default: openai/gpt-4.1' in action
          assert f'token: {expression_open} inputs.models-token || github.token }}' + '}' in action
          assert f'models-token: {expression_open} secrets.SENSEI_MODELS_TOKEN }}' + '}' in example
          assert f'token: {expression_open} secrets.SENSEI_MODELS_TOKEN }}' + '}' in smoke
          assert 'pull_request:' not in smoke
          PY
