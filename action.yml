name: 'Sensei Architectural Review'
description: "Review pull requests against your repository's architectural memory — invariants, forbidden fixes, and contracts"
author: globulario
branding:
  icon: shield
  color: purple

inputs:
  mode:
    description: "advisory (report findings, never blocks) or enforce (fail the check on a blocking finding)."
    required: false
    default: advisory
  awareness-dir:
    description: Directory holding the awareness YAML sources.
    required: false
    default: docs/awareness
  diff:
    description: "git diff range to review. Default: the PR base...HEAD (or the last commit on a push)."
    required: false
    default: ''
  domain:
    description: "Domain/repo scope, e.g. github.com/you/yourrepo. Only needed if your graph hosts more than one domain."
    required: false
    default: ''
  sarif:
    description: "Upload findings to GitHub code scanning (needs 'security-events: write' in the calling workflow). 'true' or 'false'."
    required: false
    default: 'true'
  sensei-ref:
    description: Git ref of globulario/sensei to install/build the reviewer from (tag/branch/SHA).
    required: false
    default: v0.2.2
  go-version:
    description: Go toolchain version used for the source-build fallback.
    required: false
    default: '1.25'

runs:
  using: composite
  steps:
    - name: Set up Go (for the source-build fallback)
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install Sensei (prebuilt, or build) + Oxigraph
      shell: bash
      run: |
        set -euo pipefail
        REF="${{ inputs.sensei-ref }}"
        BIN="$RUNNER_TEMP/sensei-bin"; mkdir -p "$BIN"
        case "$(uname -m)" in x86_64) ARCH=amd64;; aarch64|arm64) ARCH=arm64;; *) ARCH=amd64;; esac

        # Fast path: download prebuilt standalone binaries for this ref (linux-amd64).
        got=0
        if [ "$ARCH" = amd64 ]; then
          REL="https://github.com/globulario/sensei/releases/download/${REF}"
          if curl -fsSL -o "$BIN/sensei" "${REL}/sensei-linux-amd64" \
             && curl -fsSL -o "$BIN/awareness-graph" "${REL}/awareness-graph-linux-amd64"; then
            chmod +x "$BIN/sensei" "$BIN/awareness-graph"; got=1
            echo "✓ using prebuilt Sensei binaries (${REF}, linux-amd64)"
          fi
        fi

        # Fallback: build from source (any ref / arch without prebuilt binaries).
        if [ "$got" = 0 ]; then
          echo "→ no prebuilt binaries for ${REF} (${ARCH}); building from source"
          command -v go >/dev/null 2>&1 || { echo "::error::Go toolchain unavailable for the source-build fallback"; exit 1; }
          SRC="$RUNNER_TEMP/sensei-src"; rm -rf "$SRC"
          git clone --depth 1 --branch "${REF}" https://github.com/globulario/sensei "$SRC"
          ( cd "$SRC" && go build -o "$BIN/sensei" ./cmd/awg && go build -o "$BIN/awareness-graph" ./golang/server )
        fi

        # Oxigraph (upstream static binary; no Docker, no cgo).
        OXV="$(curl -fsSL https://api.github.com/repos/oxigraph/oxigraph/releases/latest | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        [ -n "${OXV:-}" ] || OXV="v0.5.9"
        case "$ARCH" in amd64) OXA="x86_64_linux_gnu";; arm64) OXA="aarch64_linux_gnu";; esac
        curl -fsSL -o "$BIN/oxigraph" "https://github.com/oxigraph/oxigraph/releases/download/${OXV}/oxigraph_${OXV}_${OXA}"
        chmod +x "$BIN/oxigraph"

        echo "$BIN" >> "$GITHUB_PATH"

    - name: Validate the awareness corpus
      shell: bash
      run: sensei check

    - name: Start store + server
      shell: bash
      run: |
        set -euo pipefail
        # `sensei serve` runs Oxigraph (:7878) as a child and the gRPC server (:10120).
        nohup sensei serve --no-seed --allow-stale-seed > "$RUNNER_TEMP/sensei-serve.log" 2>&1 &
        for i in $(seq 1 60); do
          if (exec 3<>/dev/tcp/localhost/10120) 2>/dev/null; then exec 3>&-; break; fi
          sleep 1
          if [ "$i" = 60 ]; then echo "::error::server did not start"; cat "$RUNNER_TEMP/sensei-serve.log"; exit 1; fi
        done

    - name: Compile the awareness graph
      shell: bash
      run: sensei build --input "${{ inputs.awareness-dir }}" --store-url "http://localhost:7878/store?default"

    - name: Review the diff
      id: review
      shell: bash
      run: |
        set -euo pipefail
        RANGE="${{ inputs.diff }}"
        if [ -z "$RANGE" ]; then
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" || true
            RANGE="origin/${GITHUB_BASE_REF}...HEAD"
          else
            RANGE="HEAD~1...HEAD"
          fi
        fi
        MODE="${{ inputs.mode }}"
        DOMAIN=""; [ -n "${{ inputs.domain }}" ] && DOMAIN="--domain ${{ inputs.domain }}"
        SARIF_FILE="$RUNNER_TEMP/sensei.sarif"
        SARIF=""; [ "${{ inputs.sarif }}" = "true" ] && SARIF="--sarif $SARIF_FILE"
        echo "reviewing diff: $RANGE (mode=$MODE)"

        set +e
        sensei gate --diff "$RANGE" --repo-root . $DOMAIN --mode "$MODE" $SARIF 2>&1 | tee "$RUNNER_TEMP/gate.out"
        CODE=${PIPESTATUS[0]}
        set -e
        echo "code=$CODE" >> "$GITHUB_OUTPUT"

        # Guarantee a SARIF file exists for the upload step (empty = clears prior alerts).
        if [ "${{ inputs.sarif }}" = "true" ] && [ ! -f "$SARIF_FILE" ]; then
          printf '%s' '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Sensei","informationUri":"https://github.com/globulario/sensei","rules":[]}},"results":[]}]}' > "$SARIF_FILE"
        fi

        {
          echo "## Sensei architectural review"
          echo ""
          echo "Diff \`$RANGE\` · mode \`$MODE\`"
          echo ""
          if [ "$MODE" = advisory ]; then echo "ℹ️ Advisory run — findings reported below; the check does not block."
          elif [ "$CODE" = "0" ]; then echo "✅ No blocking architectural findings."
          elif [ "$CODE" = "2" ]; then echo "⚠️ Sensei could not verify the diff and failed closed."
          else echo "❌ Blocking architectural finding(s) — see below."; fi
          echo ""
          echo '```'
          cat "$RUNNER_TEMP/gate.out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload findings to code scanning
      if: ${{ inputs.sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/sensei.sarif
        category: sensei

    - name: Enforce verdict
      if: ${{ steps.review.outputs.code != '0' }}
      shell: bash
      run: |
        echo "::error::Sensei gate exited ${{ steps.review.outputs.code }} (mode=${{ inputs.mode }})"
        exit ${{ steps.review.outputs.code }}
